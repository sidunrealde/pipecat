<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Conversation</title>
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <h1>🎭 Avatar Conversation</h1>
            <div id="connection-status" class="status disconnected">
                <span class="dot"></span>
                <span class="text">Disconnected</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Left: Avatar Display -->
            <section class="avatar-section">
                <div class="avatar-container">
                    <canvas id="avatar-canvas" width="512" height="512"></canvas>
                    <div id="avatar-overlay" class="avatar-overlay hidden">
                        <div class="spinner"></div>
                        <span>Processing...</span>
                    </div>
                </div>

                <!-- Upload Avatar -->
                <div class="upload-section">
                    <h3>📷 Upload Avatar</h3>
                    <div class="upload-area" id="upload-area">
                        <input type="file" id="file-input" accept="image/*" hidden>
                        <p>Click or drag image here</p>
                        <small>PNG, JPG, GIF (512×512 recommended)</small>
                    </div>
                    <div id="upload-status" class="upload-status"></div>
                </div>

                <!-- Settings -->
                <div class="settings-section">
                    <button id="settings-toggle" class="btn-toggle">⚙️ Settings</button>
                    <div id="settings-panel" class="settings-panel hidden">
                        <div class="setting">
                            <label>Avatar Name</label>
                            <input type="text" id="avatar-name" value="Avatar">
                        </div>
                        <div class="setting">
                            <label>Personality</label>
                            <textarea id="system-prompt" rows="3" placeholder="Describe the avatar's personality...">You are a helpful, friendly AI assistant.</textarea>
                        </div>
                        <div class="setting">
                            <label>Temperature: <span id="temp-value">0.7</span></label>
                            <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
                        </div>
                        <div class="setting">
                            <label>
                                <input type="checkbox" id="continuous-mode">
                                Continuous Mode
                            </label>
                        </div>
                        <button id="save-settings" class="btn btn-small">Save Settings</button>
                    </div>
                </div>
            </section>

            <!-- Right: Chat -->
            <section class="chat-section">
                <!-- Chat History -->
                <div id="chat-history" class="chat-history">
                    <div class="message system">
                        <p>Welcome! Upload an avatar image and start chatting.</p>
                    </div>
                </div>

                <!-- Input Area -->
                <div class="input-area">
                    <!-- Audio Controls -->
                    <div class="audio-controls">
                        <button id="record-btn" class="btn btn-record" disabled>
                            🎤 Record
                        </button>
                        <canvas id="visualizer" class="visualizer"></canvas>
                    </div>

                    <!-- Text Input -->
                    <div class="text-input-area">
                        <input type="text" id="text-input" placeholder="Type a message..." disabled>
                        <button id="send-btn" class="btn btn-send" disabled>Send</button>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <span id="status-text">Ready</span>
        </footer>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="static/app.js"></script>
</body>
</html>
